    </style><rect fill="#fcfdfb" width="794" height="601"/><g data-export-diagram="true" transform="translate(-56 -15.687858581542969)"><g/><g><g class="graph-edge  " data-edge="E39"><title>E39 · Social cohesion → Usable green-space quality (+). Source-reported mechanism.</title><path d="M 188 253 C 188 59.33 718 59.33 718 245.2 L 718 251.20001220703125" class="edge-terminal" stroke="#17675f" stroke-dasharray="666.1454467773438 666.1454467773438" stroke-dashoffset="-648.1454467773438" aria-hidden="true"/><path d="M 188 253 C 188 59.33 718 59.33 718 245.2 L 718 251.20001220703125" class="edge-visual" stroke="#17675f" marker-end="url(#arrow-positive)"/><circle cx="714.3912082887069" cy="219.5372973289803" r="12" class="polarity-bg"/><text x="714.3912082887069" y="220.0372973289803" text-anchor="middle" dominant-baseline="middle" fill="#17675f" class="edge-sign">+</text><circle cx="443.4222526435193" cy="106.93785659487784" r="11" class="polarity-bg delay-bg"/><text x="443.4222526435193" y="107.43785659487784" text-anchor="middle" dominant-baseline="middle" class="edge-delay">∥</text></g><g class="graph-edge  " data-edge="E38"><title>E38 · Usable green-space quality → Social cohesion (+). Source-reported mechanism.</title><path d="M 718 351 C 718 544.67 188 544.67 188 358.8 L 188 352.79998779296875" class="edge-terminal" stroke="#17675f" stroke-dasharray="666.145263671875 666.145263671875" stroke-dashoffset="-648.145263671875" aria-hidden="true"/><path d="M 718 351 C 718 544.67 188 544.67 188 358.8 L 188 352.79998779296875" class="edge-visual" stroke="#17675f" marker-end="url(#arrow-positive)"/><circle cx="191.608791711293" cy="384.4627026710197" r="12" class="polarity-bg"/><text x="191.608791711293" y="384.9627026710197" text-anchor="middle" dominant-baseline="middle" fill="#17675f" class="edge-sign">+</text><circle cx="462.57774735648064" cy="497.06214340512196" r="11" class="polarity-bg delay-bg"/><text x="462.57774735648064" y="497.56214340512196" text-anchor="middle" dominant-baseline="middle" class="edge-delay">∥</text></g></g><g><g class="node" transform="translate(76 258)" data-node="V28"><rect width="224" height="88" rx="10" class="node-box"/><rect x="0" y="14" width="4" height="60" rx="2" class="node-stripe" fill="#708a56" style="fill:#708a56"/><text x="14" y="17" class="node-id">V28</text><text x="112" y="55" text-anchor="middle" class="node-label" style="font-size:18px"><tspan x="112" dy="0">Social cohesion</tspan></text><title>Inclusive trust, support and collective capacity among original residents facing disadvantage; exclusionary bonding is not counted as an equity benefit.</title></g><g class="node" transform="translate(606 257.99999999999994)" data-node="V14"><rect width="224" height="88" rx="10" class="node-box"/><rect x="0" y="14" width="4" height="60" rx="2" class="node-stripe" fill="#708a56" style="fill:#708a56"/><text x="14" y="17" class="node-id">V14</text><text x="112" y="45" text-anchor="middle" class="node-label" style="font-size:18px"><tspan x="112" dy="0">Usable green-space</tspan><tspan x="112" dy="20">quality</tspan></text><title>Condition and usability of shared green spaces serving residents facing disadvantage, including maintenance, welcoming design and effective access. Canopy and shade are separate attributes: a quality improvement has a cooling effect only when it improves those attributes at places people use.</title></g></g><g><g class="loop-badge" transform="translate(453 302)" data-loop="R2"><circle r="31" fill="#246d5d"/><text x="0" y="1">R2</text><text x="0" y="55" class="loop-center-caption" style="fill:#354b51;font:600 14px &quot;Segoe UI&quot;,Arial,sans-serif">Reinforcing</text></g></g></g><text x="20" y="40" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" fill="#173c43">R2 · Green-space stewardship</text><text x="20" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#42585b">Source-described structure · 2 variables · 2 relationships</text><text x="20" y="520.374267578125" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#354e54">+ Same direction − Opposite direction ∥ Delay (duration not estimated)</text><text x="20" y="538.374267578125" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#354e54">Solid: source-reported Dashed: inferred / conditional / definition Dotted: disparity indicator</text><text x="20" y="556.374267578125" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#354e54">R: reinforcing B: balancing Loop type does not determine benefit or harm.</text><text x="20" y="574.374267578125" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#354e54">Conceptual model 2026-11-03.2. Evidence and assumptions: see the interactive atlas.</text></svg>